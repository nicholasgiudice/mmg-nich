# Deploy de desenvolvimento (T-110, T-210, T-211). Na raiz do repositório:
#   docker compose -f deploy/compose.yml up -d --build
# Precisa de deploy/.env com POSTGRES_PASSWORD, MMO_SESSION_KEY e MMO_GAME_TICKET_KEY (modelo em deploy/.env.example).
# Precisa também de MMO_API_DOMAIN (domínio da API com DNS apontando para a VPS; T-213).
# Portas publicadas aqui ignoram o ufw: publique só 80/443 (Caddy) e 7777/udp. O PostgreSQL e a API ficam só na rede interna.
name: mmo-rpg

services:
  game-server:
    build:
      context: ..
      dockerfile: deploy/game-server/Dockerfile
    image: mmo-rpg/game-server:dev
    command: ["--encounter", "${GAME_ENCOUNTER:-encounter.forest_matriarch}", "--bots", "${GAME_BOTS:-true}", "--restart-after", "${GAME_RESTART_AFTER:-10}", "--log-level", "${GAME_LOG_LEVEL:-info}"]
    environment:
      # Contas (T-212): carrega e grava personagens; o token de jogo usa a mesma chave e o mesmo id de servidor da API.
      MMO_DB_CONNECTION: "Host=postgres;Database=${POSTGRES_DB:-mmo};Username=${POSTGRES_USER:-mmo};Password=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD em deploy/.env}"
      MMO_GAME_TICKET_KEY: ${MMO_GAME_TICKET_KEY:?defina MMO_GAME_TICKET_KEY em deploy/.env (modelo em deploy/.env.example)}
      MMO_GAME_SERVER_ID: ${MMO_GAME_SERVER_ID:-game.dev}
      # Login só com nome (cliente atual e bots) até o cliente entrar com token (T-220). false = só com token.
      MMO_DEV_LOGIN: ${GAME_DEV_LOGIN:-true}
      # Mundo aberto (T-214): Cidade + Campos em vez da sala de encontro (--encounter, --bots e --restart-after não valem).
      MMO_WORLD: ${GAME_WORLD:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "7777:7777/udp"
    restart: unless-stopped
    stop_grace_period: 30s # na parada, grava os personagens conectados antes de sair (até 20 s)
    stdin_open: true # console do servidor via "docker compose attach" (restart · status)

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mmo}
      POSTGRES_DB: ${POSTGRES_DB:-mmo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD em deploy/.env (modelo em deploy/.env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    # sem "ports:": só os serviços do Compose alcançam o banco

  migrate:
    build:
      context: ..
      dockerfile: deploy/migrate/Dockerfile
    image: mmo-rpg/migrate:dev
    environment:
      MMO_DB_CONNECTION: "Host=postgres;Database=${POSTGRES_DB:-mmo};Username=${POSTGRES_USER:-mmo};Password=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD em deploy/.env}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no" # aplica as migrations pendentes e sai

  api:
    build:
      context: ..
      dockerfile: deploy/api/Dockerfile
    image: mmo-rpg/api:dev
    environment:
      MMO_DB_CONNECTION: "Host=postgres;Database=${POSTGRES_DB:-mmo};Username=${POSTGRES_USER:-mmo};Password=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD em deploy/.env}"
      MMO_SESSION_KEY: ${MMO_SESSION_KEY:?defina MMO_SESSION_KEY em deploy/.env (modelo em deploy/.env.example)}
      MMO_GAME_TICKET_KEY: ${MMO_GAME_TICKET_KEY:?defina MMO_GAME_TICKET_KEY em deploy/.env (modelo em deploy/.env.example)}
      MMO_GAME_SERVER_ID: ${MMO_GAME_SERVER_ID:-game.dev}
      MMO_GAME_SERVER_ADDRESS: ${MMO_GAME_SERVER_ADDRESS:-}
      MMO_AUTH_RATE_LIMIT: ${MMO_AUTH_RATE_LIMIT:-10}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8080"
    restart: unless-stopped
    # sem "ports:": de fora, só pelo Caddy (T-213)

  caddy:
    # HTTPS automático na frente da API (T-213). A 80 serve o desafio do Let's Encrypt e redireciona para a 443.
    image: caddy:2.10-alpine
    environment:
      MMO_API_DOMAIN: "${MMO_API_DOMAIN:?defina MMO_API_DOMAIN em deploy/.env (domínio da API, ex. api.exemplo.com)}"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificados e chaves: não apague, ou o Let's Encrypt pode limitar novas emissões
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
