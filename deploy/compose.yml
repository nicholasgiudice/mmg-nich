# Deploy de desenvolvimento (T-110). Na raiz do repositório:
#   docker compose -f deploy/compose.yml up -d --build
# Portas publicadas aqui ignoram o ufw: publique só 7777/udp.
name: mmo-rpg

services:
  game-server:
    build:
      context: ..
      dockerfile: deploy/game-server/Dockerfile
    image: mmo-rpg/game-server:dev
    command: ["--encounter", "${GAME_ENCOUNTER:-encounter.forest_matriarch}", "--bots", "${GAME_BOTS:-true}", "--restart-after", "${GAME_RESTART_AFTER:-10}"]
    ports:
      - "7777:7777/udp"
    restart: unless-stopped
    stdin_open: true # console do servidor via "docker compose attach" (restart · status)
